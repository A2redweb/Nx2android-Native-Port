[workspace]
resolver = "2"
members = ["crates/nx-profile", "crates/nx-container", "crates/nx-keys", "crates/nx-crypto", "crates/nx-nca", "crates/nx-fs", "crates/nxn", "crates/nx-extract", "crates/nx-zstd", "crates/nx-nsz"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
