name: bionic-tools
# Spike 1: can the porter's .NET tools be built for Android itself (no proot)?
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: shirai91/nx2android commit or branch
        default: main
jobs:
  build:
    runs-on: ubuntu-latest   # the NDK's own tools are x86-64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Fetch upstream porter
        run: |
          mkdir -p /tmp/up && curl -fsSL "https://codeload.github.com/shirai91/nx2android/tar.gz/${{ inputs.upstream }}" | tar -xz -C /tmp/up --strip-components=1
          echo "KEY=$(python3 tools/prebuilt_key.py /tmp/up)" >> "$GITHUB_ENV"
      - name: Build the translator for linux-bionic-arm64
        run: bash tools/make_bionic_tools.sh /tmp/up /tmp/out
      - name: Why it failed (diagnostic)
        if: failure()
        run: |
          ls ~/.nuget/packages | grep -i -E "ilcompiler|runtime\." || true
          grep -rn "PrivateSdkAssemblies" ~/.nuget/packages/microsoft.dotnet.ilcompiler/*/build/ | cut -c1-300 || true
          for id in microsoft.netcore.app.runtime.nativeaot.linux-bionic-arm64 runtime.linux-bionic-arm64.microsoft.dotnet.ilcompiler microsoft.netcore.app.runtime.linux-bionic-arm64; do echo "== nuget $id"; curl -fsS "https://api.nuget.org/v3-flatcontainer/$id/index.json" | tr -d ' \n' | cut -c1-400 || echo "not on nuget"; echo; done
          find ~/.nuget/packages/microsoft.netcore.app.runtime.nativeaot.linux-arm64 -maxdepth 4 | head -20
          find ~/.nuget/packages/microsoft.netcore.app.runtime.linux-bionic-arm64 -maxdepth 4 | head -12
          for d in ~/.nuget/packages/runtime.*ilcompiler*/*; do echo "== $d"; ls "$d" "$d/sdk" 2>/dev/null | head -20; done
      - uses: actions/upload-artifact@v4
        with: { name: 'bionic-tools-${{ env.KEY }}', path: /tmp/out }
