name: android
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.12433566"
      - run: rustup target add aarch64-linux-android && cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"
      - run: sh tools/build_android.sh
      - uses: actions/upload-artifact@v4
        with: { name: nx2android-native-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
