name: android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.12433566"
      - run: rustup target add aarch64-linux-android && cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"
      - run: sh tools/build_android.sh
      - uses: actions/upload-artifact@v4
        with: { name: nx2android-native-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Inspect the APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          ls -l "$APK"
          unzip -l "$APK" | grep -E "lib/|classes|AndroidManifest|assets/games/" | head -20
          echo "games in assets: $(unzip -l "$APK" | grep -c 'assets/games/.*game.tsv')"
          unzip -o -q "$APK" lib/arm64-v8a/libnxcore.so -d /tmp/apkx
          readelf -lW /tmp/apkx/lib/arm64-v8a/libnxcore.so | grep LOAD
          nm -D /tmp/apkx/lib/arm64-v8a/libnxcore.so | grep Java_
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | grep -E "libnxcore|Verification" || true
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdk|uses-permission|native-code"
      - name: Publish the APK as the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk nx2android-native-debug.apk
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --target "$GITHUB_SHA" --title "Nightly debug build" --notes "Debug APK of the latest commit on main. Untested on a device."
          gh release upload nightly nx2android-native-debug.apk --clobber
          gh release edit nightly --notes "Debug APK built from $GITHUB_SHA. Untested on a device."
